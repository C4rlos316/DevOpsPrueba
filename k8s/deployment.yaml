apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mi-tienda
  template:
    metadata:
      labels:
        app: mi-tienda
    spec:
      containers:
      - name: mi-tienda
        image: c4rlos316/mi-tienda:v1
        ports:
        - containerPort: 80
